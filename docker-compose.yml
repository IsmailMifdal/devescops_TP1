name: devsecops-tp1

services:
  api-python:
    build:
      context: .
      target: runtime
      # Secret de BUILD (jeton du dépôt interne) : tmpfs le temps du RUN pip
      secrets:
        - pip_token
    image: devsecops-tp1-api:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      ENV: test
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      # Le mot de passe n'est jamais dans l'environnement : fichier secret monté
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Forme exec : pas de shell dans l'image, on utilise Python et sa stdlib
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    image: cgr.dev/chainguard/postgres:latest@sha256:b32c0efe4c15bbc08fcd801f619a7d98d44f3f8eca3ec89efad4941a56e8741c
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      # Lu par file_env dans l'entrypoint de l'image (convention *_FILE)
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Forme exec + utilitaire client fourni par l'image ; -h 127.0.0.1 force TCP
      test:
        - CMD
        - pg_isready
        - -h
        - 127.0.0.1
        - -U
        - ${POSTGRES_USER}
        - -d
        - ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Tests d'intégration pytest (lancés à la demande : --profile test)
  tests:
    profiles:
      - test
    build:
      context: .
      target: test
      secrets:
        - pip_token
    image: devsecops-tp1-tests:local
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - ./test_app.py:/app/test_app.py:ro
      - ./pytest.ini:/app/pytest.ini:ro
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      api-python:
        condition: service_healthy

networks:
  frontend: {}
  backend:
    # Réseau interne : la base n'est joignable ni depuis l'hôte ni depuis Internet
    internal: true

volumes:
  db-data:

secrets:
  # Fichier local non versionné (.gitignore / .dockerignore), monté en
  # lecture seule dans /run/secrets/db_password des seuls services déclarés
  db_password:
    file: ./secrets/db_password.txt
  # Secret de build : consommé uniquement par RUN --mount=type=secret,id=pip_token
  pip_token:
    file: ./secrets/pip_token
